name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke (preview + rotas críticas)
        run: |
          npm run preview -- --port 5199 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5199/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5199/
          curl -sf -o /dev/null http://localhost:5199/sitemap.xml
          curl -sf -o /dev/null http://localhost:5199/robots.txt
          curl -sf -o /dev/null http://localhost:5199/curriculo-minimal.pdf
          curl -sf -o /dev/null http://localhost:5199/curriculo-completo.pdf
          kill $PREVIEW_PID
